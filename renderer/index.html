<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forma</title>
    <style>
      body {
        margin: 0;
        font-family: monospace;
        background: #f5f5f5;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 25%;
        height: 100%;
        background: white;
        border-right: 1px solid #ddd;
        box-sizing: border-box;
      }

      #dialog {
        height: 50%;
        overflow-y: auto;
        border-bottom: 1px solid #ddd;
        padding: 16px;
        box-sizing: border-box;
      }

      #dialog-log {
        min-height: 60%;
      }

      .msg-system {
        color: #333;
        margin-bottom: 8px;
      }

      .msg-user {
        color: #0066cc;
        text-align: right;
        margin-bottom: 8px;
      }

      #dialog input {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
        border: 1px solid #ddd;
        font-family: monospace;
        box-sizing: border-box;
      }

      #dialog button {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        background: #333;
        color: white;
        border: none;
        cursor: pointer;
        font-family: monospace;
      }

      #bom {
        height: 50%;
        overflow-y: auto;
        padding: 20px;
        box-sizing: border-box;
      }

      #scene {
        position: fixed;
        top: 0;
        right: 0;
        width: 75%;
        height: 100%;
      }

      #bom h1 {
        margin-top: 0;
        font-size: 18px;
      }

      .bom-line {
        margin: 8px 0;
      }

      .bom-totals {
        margin-top: 16px;
        font-weight: bold;
      }

      .scene-error {
        margin: 24px;
        padding: 16px;
        background: #ff4d4f;
        color: white;
        font-weight: bold;
      }

      .element-label {
        color: #222;
        font-size: 11px;
        background: rgba(255, 255, 255, 0.9);
        padding: 2px 6px;
        border-radius: 3px;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <aside id="sidebar">
      <div id="dialog">
        <div id="dialog-log"></div>
        <input id="dialog-input" type="text" placeholder="Напишите, что нужно для рабочего места" />
        <button id="dialog-send" type="button">Отправить</button>
      </div>
      <div id="bom">BOM появится после завершения диалога</div>
    </aside>
    <div id="scene"></div>
    <script type="module">
      import { renderScene } from './scene3d.js';

      let profileId = null;
      const logEl = document.getElementById('dialog-log');
      const inputEl = document.getElementById('dialog-input');
      const sendBtn = document.getElementById('dialog-send');

      function addMessage(text, role) {
        const line = document.createElement('div');
        line.className = role === 'user' ? 'msg-user' : 'msg-system';
        line.textContent = text;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function renderBom(bom) {
        const panel = document.getElementById('bom');
        if (!bom) {
          panel.textContent = 'BOM unavailable';
          return;
        }

        const lines = bom.lines
          .map(
            (line) =>
              `<div class="bom-line">${line.name} ×${line.quantity} — ${line.priceEur} EUR (${line.totalEur} EUR)</div>`
          )
          .join('');

        panel.innerHTML = `
          <h1>BOM</h1>
          ${lines}
          <div class="bom-totals">
            <div>Subtotal: ${bom.subtotalEur} EUR</div>
            <div>VAT: ${bom.vatEur} EUR</div>
            <div>Total: ${bom.totalEur} EUR</div>
          </div>
        `;
      }

      function applyResult(data) {
        const sceneRoot = document.getElementById('scene');

        if (data.compatibilityResult && data.compatibilityResult.valid === false) {
          const conflict = data.compatibilityResult.conflicts[0];
          const message = conflict ? conflict.reason : 'Configuration is not compatible';
          sceneRoot.innerHTML = `<div class="scene-error">${message}</div>`;
          return;
        }

        if (data.sceneSolution && data.sceneSolution.status === 'unsolvable') {
          const message =
            data.sceneSolution.violated && data.sceneSolution.violated[0]
              ? data.sceneSolution.violated[0].message
              : 'Scene is unsolvable';
          sceneRoot.innerHTML = `<div class="scene-error">${message}</div>`;
          return;
        }

        if (data.bom) {
          renderBom(data.bom);
        }

        if (data.sceneSolution && data.graph) {
          renderScene(data.sceneSolution, data.graph);
        }
      }

      async function startSession() {
        const response = await fetch('/api/session/start', { method: 'POST' });
        const data = await response.json();
        profileId = data.profileId;
        addMessage(data.nextQuestion, 'system');
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || !profileId) {
          return;
        }

        inputEl.value = '';
        addMessage(text, 'user');

        const response = await fetch('/api/session/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profileId, text }),
        });
        const data = await response.json();

        if (data.nextQuestion) {
          addMessage(data.nextQuestion, 'system');
          return;
        }

        addMessage('Конфигурация собрана. Можете менять элементы.', 'system');
        applyResult(data);
      }

      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });

      await startSession();
    </script>
  </body>
</html>
